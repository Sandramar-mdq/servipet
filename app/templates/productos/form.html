{% extends "base.html" %}
{% block title %}{% if producto %}Editar Producto{% else %}Nuevo Producto{% endif %} — Servipet{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto">
    <h1 class="text-2xl font-bold text-gray-800 mb-6">{% if producto %}Editar Producto{% else %}Nuevo Producto{% endif %}</h1>

    <form method="post" action="{% if producto %}/page/productos/{{ producto.id }}/editar{% else %}/page/productos/nuevo{% endif %}"
        class="bg-white rounded-2xl shadow-lg border border-gray-100 p-6 space-y-4">

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Nombre *</label>
            <input type="text" name="nombre" value="{{ producto.nombre if producto else '' }}" required
                class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Descripcion</label>
            <textarea name="descripcion" rows="2"
                class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">{{ producto.descripcion if producto else '' }}</textarea>
        </div>

        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Precio Compra</label>
                <input type="number" step="0.01" name="precio_compra" value="{{ producto.precio_compra if producto else '0.00' }}"
                    class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Precio Venta</label>
                <input type="number" step="0.01" name="precio_venta" value="{{ producto.precio_venta if producto else '0.00' }}"
                    class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            </div>
        </div>

        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Stock Actual</label>
                <input type="number" name="stock_actual" value="{{ producto.stock_actual if producto else '0' }}"
                    class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Stock Minimo</label>
                <input type="number" name="stock_minimo" value="{{ producto.stock_minimo if producto else '0' }}"
                    class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            </div>
        </div>

        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Unidad</label>
                <select name="unidad_medida" class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    <option value="un" {% if producto and producto.unidad_medida == 'un' %}selected{% endif %}>Unidad</option>
                    <option value="kg" {% if producto and producto.unidad_medida == 'kg' %}selected{% endif %}>Kilogramo</option>
                    <option value="lt" {% if producto and producto.unidad_medida == 'lt' %}selected{% endif %}>Litro</option>
                    <option value="ml" {% if producto and producto.unidad_medida == 'ml' %}selected{% endif %}>Mililitro</option>
                    <option value="gr" {% if producto and producto.unidad_medida == 'gr' %}selected{% endif %}>Gramo</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Categoria</label>
                <input type="text" name="categoria" value="{{ producto.categoria if producto else 'GENERAL' }}"
                    class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            </div>
        </div>

        <div class="flex gap-3 pt-2">
            <a href="/page/productos" class="flex-1 bg-gray-200 text-gray-700 px-4 py-2.5 rounded-lg text-sm font-medium hover:bg-gray-300 transition text-center">Cancelar</a>
            <button type="submit" class="flex-1 bg-indigo-600 text-white px-4 py-2.5 rounded-lg text-sm font-medium hover:bg-indigo-700 transition">Guardar</button>
        </div>
    </form>
</div>
{% endblock %}
