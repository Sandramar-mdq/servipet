<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>{% block title %}Servipet{% endblock %}</title>

    <!-- PWA -->
    <link rel="manifest" href="/static/manifest.json">
    <link rel="icon" type="image/x-icon" href="/static/icons/favicon.ico">
    <meta name="theme-color" content="#4F46E5">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Servipet">
    <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
    <meta name="description" content="Portal de clientes Servipet">

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        [x-cloak] { display: none !important; }
        html { overscroll-behavior-y: none; }
        body {
            padding-top: env(safe-area-inset-top);
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        main { padding-bottom: calc(6.5rem + env(safe-area-inset-bottom)); }

        @keyframes slide-up {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        #install-banner:not(.hidden) { animation: slide-up 0.3s ease-out; }
        @media (display-mode: standalone) {
            #install-banner { display: none !important; }
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">

    <!-- Flash messages -->
    {% if success %}
    <div class="px-4 pt-4">
        <div class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded-2xl text-sm">
            {{ success }}
        </div>
    </div>
    {% endif %}
    {% if error %}
    <div class="px-4 pt-4">
        <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded-2xl text-sm">
            {{ error }}
        </div>
    </div>
    {% endif %}

    <!-- Content -->
    <main class="max-w-3xl mx-auto px-4 pt-6">
        {% block content %}{% endblock %}
    </main>

    <!-- PWA install prompt (bottom, above nav) -->
    <div id="install-banner" class="hidden fixed inset-x-0 z-40 px-4"
         style="bottom: calc(4.5rem + env(safe-area-inset-bottom));">
        <div class="bg-white border border-indigo-200 rounded-2xl px-4 py-3 flex items-center justify-between gap-3 shadow-lg">
            <div class="flex items-center gap-3 min-w-0">
                <img src="/static/icons/icon-192.png" alt="" class="w-10 h-10 rounded-xl shrink-0">
                <div class="min-w-0">
                    <p class="text-sm font-semibold text-gray-800 leading-tight">Instalar Servipet</p>
                    <p class="text-xs text-gray-500">Acceso rapido desde tu pantalla de inicio</p>
                </div>
            </div>
            <div class="flex items-center gap-1 shrink-0">
                <button id="install-btn" class="bg-indigo-600 text-white px-4 py-2 rounded-xl text-sm font-medium hover:bg-indigo-700 active:bg-indigo-800 transition">Instalar</button>
                <button id="install-dismiss" aria-label="Descartar aviso" class="text-gray-400 hover:text-gray-600 p-2 rounded-lg transition text-lg leading-none">&times;</button>
            </div>
        </div>
    </div>

    <!-- Bottom Navigation Bar -->
    <nav class="fixed bottom-0 inset-x-0 z-50 bg-white border-t border-gray-200 shadow-[0_-2px_10px_rgba(0,0,0,0.05)]"
         style="padding-bottom: env(safe-area-inset-bottom);">
        <div class="max-w-3xl mx-auto grid grid-cols-4">
            <a href="/cliente/dashboard"
               aria-current="{% if request.url.path == '/cliente/dashboard' %}page{% endif %}"
               class="flex flex-col items-center justify-center py-3 min-h-14 text-xs font-medium transition active:opacity-70
                      {% if request.url.path == '/cliente/dashboard' %}text-indigo-600{% else %}text-gray-400 hover:text-indigo-500{% endif %}">
                <svg class="w-6 h-6 mb-0.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l9-9 9 9M5 10v10a1 1 0 001 1h3a1 1 0 001-1v-4h4v4a1 1 0 001 1h3a1 1 0 001-1V10"/>
                </svg>
                Inicio
            </a>
            <a href="/cliente/turnos"
               aria-current="{% if request.url.path in ['/cliente/turnos', '/cliente/reservar'] %}page{% endif %}"
               class="flex flex-col items-center justify-center py-3 min-h-14 text-xs font-medium transition active:opacity-70
                      {% if request.url.path in ['/cliente/turnos', '/cliente/reservar'] %}text-indigo-600{% else %}text-gray-400 hover:text-indigo-500{% endif %}">
                <svg class="w-6 h-6 mb-0.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
                </svg>
                Mis Turnos
            </a>
            <a href="/cliente/mascotas"
               aria-current="{% if request.url.path == '/cliente/mascotas' %}page{% endif %}"
               class="flex flex-col items-center justify-center py-3 min-h-14 text-xs font-medium transition active:opacity-70
                      {% if request.url.path == '/cliente/mascotas' %}text-indigo-600{% else %}text-gray-400 hover:text-indigo-500{% endif %}">
                <svg class="w-6 h-6 mb-0.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.25c2-1.5 4.5-1.5 6 0 1.5 1.5 1.5 4 0 5.5L12 18l-6-6.25c-1.5-1.5-1.5-4 0-5.5 1.5-1.5 4-1.5 6 0z"/>
                </svg>
                Mis Mascotas
            </a>
            <a href="/cliente/logout"
               class="flex flex-col items-center justify-center py-3 min-h-14 text-xs font-medium transition text-gray-400 hover:text-red-500 active:opacity-70">
                <svg class="w-6 h-6 mb-0.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
                </svg>
                Salir
            </a>
        </div>
    </nav>

    <!-- Scripts -->
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/static/sw.js').catch(function() {});
        }

        var INSTALL_KEY = 'servipet_install_dismissed';
        var isStandalone = window.matchMedia && window.matchMedia('(display-mode: standalone)').matches ||
            (window.navigator.standalone === true);
        var deferredPrompt = null;

        function hideInstallBanner() {
            var banner = document.getElementById('install-banner');
            if (banner) banner.classList.add('hidden');
        }

        window.addEventListener('beforeinstallprompt', function(e) {
            e.preventDefault();
            deferredPrompt = e;
            if (isStandalone || localStorage.getItem(INSTALL_KEY)) return;
            document.getElementById('install-banner').classList.remove('hidden');
        });

        document.getElementById('install-btn').addEventListener('click', function() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then(function() { deferredPrompt = null; });
            }
            hideInstallBanner();
        });

        document.getElementById('install-dismiss').addEventListener('click', function() {
            localStorage.setItem(INSTALL_KEY, '1');
            hideInstallBanner();
        });

        window.addEventListener('appinstalled', function() {
            localStorage.setItem(INSTALL_KEY, '1');
            deferredPrompt = null;
            hideInstallBanner();
        });
    </script>

    {% block scripts %}{% endblock %}
</body>
</html>
