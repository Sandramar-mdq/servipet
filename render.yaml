services:
  - type: web
    name: servipet
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    preDeployCommand: python init_db.py
    healthCheckPath: /cliente/login
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: NOTIFICATION_PROVIDER
        value: log
      - key: DEBUG
        value: "false"
